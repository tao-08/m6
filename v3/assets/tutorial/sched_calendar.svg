<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 1000" width="742" height="1000">
  <!-- マイスケジュールの使い方 3枚目「カレンダー連携」: サイト（A）⇄ カレンダー の図 -->
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#9a948c"/>
    </marker>
  </defs>
  <rect width="742" height="1000" fill="#f4f1ec"/>

  <!-- サイトのアイコン（A） -->
  <g transform="translate(241 90)" filter="url(#sh)">
    <rect width="260" height="260" rx="58" fill="#fff"/>
  </g>
  <g transform="translate(266 115) scale(.41)">
    <path fill-rule="evenodd" fill="#d90f0f" d="M263 57H437L395 455H276L281 389H194L157 455H38ZM297 207 253 286H291Z"/>
  </g>

  <!-- 矢印: カレンダー → サイト（予定） / サイト → カレンダー（練習） -->
  <g stroke="#9a948c" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="311" y1="590" x2="311" y2="410" marker-end="url(#ah)"/>
    <line x1="431" y1="410" x2="431" y2="590" marker-end="url(#ah)"/>
  </g>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif" font-size="34" font-weight="700" fill="#5c5750">
    <text x="281" y="512" text-anchor="end">予定</text>
    <text x="461" y="512">練習</text>
  </g>

  <!-- カレンダー -->
  <g transform="translate(221 660)">
    <g filter="url(#sh)"><rect width="300" height="270" rx="40" fill="#fff"/></g>
    <path d="M0 40a40 40 0 0 1 40-40h220a40 40 0 0 1 40 40v40H0z" fill="#d90f0f"/>
    <rect x="72" y="-18" width="18" height="46" rx="9" fill="#5c5750"/>
    <rect x="210" y="-18" width="18" height="46" rx="9" fill="#5c5750"/>
    <g fill="#e4dfd8">
      <rect x="34" y="108" width="44" height="34" rx="8"/><rect x="94" y="108" width="44" height="34" rx="8"/>
      <rect x="154" y="108" width="44" height="34" rx="8"/><rect x="214" y="108" width="44" height="34" rx="8"/>
      <rect x="34" y="158" width="44" height="34" rx="8"/><rect x="154" y="158" width="44" height="34" rx="8"/>
      <rect x="214" y="158" width="44" height="34" rx="8"/>
      <rect x="34" y="208" width="44" height="34" rx="8"/><rect x="94" y="208" width="44" height="34" rx="8"/>
      <rect x="214" y="208" width="44" height="34" rx="8"/>
    </g>
    <rect x="94" y="158" width="44" height="34" rx="8" fill="#d90f0f"/>
    <rect x="154" y="208" width="44" height="34" rx="8" fill="#9b87e8"/>
  </g>
</svg>
