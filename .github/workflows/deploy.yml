name: Deploy

# 手動実行（Actionsタブ → Deploy → Run workflow）
# push で自動にしたい場合は下の on: に `push: { branches: [main] }` を追加
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（転送せず確認のみ）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本番に「どのコミットを・いつ」上げたかを残すバージョンファイルを作る
      # → https://abbeyroad.online/deploy.json を開けば本番の中身がすぐわかる
      # （業界では /version.json や /health などで「今動いている版」を公開するのが定番）
      # ・GITHUB_SHA        : デプロイしたコミットのID（40文字）
      # ・GITHUB_RUN_NUMBER : このワークフローが何回目の実行か
      # ・date -u +%FT%TZ   : 現在時刻を世界標準時(UTC)の ISO 8601 形式で出力
      # このファイルは Actions 上で毎回作るだけなので Git には入らない
      - name: バージョンファイル作成
        run: |
          printf '{"commit":"%s","run":%s,"deployed_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$(date -u +%FT%TZ)" > v3/deploy.json
          cat v3/deploy.json

      # 前回との差分のみアップロード（状態ファイルがサーバーに作られる）
      # config.php は本番専用なので除外
      - name: FTP デプロイ
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./v3/
          server-dir: ${{ secrets.FTP_DIR }}
          dry-run: ${{ inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/*.md
            config.php
            **/config.php
