name: Deploy

# main への push で本番に自動デプロイ
# 手動実行（Actionsタブ → Deploy → Run workflow）ではドライランを選べる
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（転送せず確認のみ）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 失敗したらここで止まり、FTP デプロイまで進まない（ドライランでも実行する）
      - name: テスト
        run: php v3/tests/run.php

      # vendor/ は Git に入れていない（.gitignore）ので、ここで composer.lock どおりに入れて一緒に上げる
      # --no-dev … 開発用のパッケージは入れない
      - name: ライブラリ（vendor/）の用意
        run: composer install --working-dir=v3 --no-dev --no-interaction --no-progress --prefer-dist

      # 本番に「どのコミットを・いつ」上げたかを残すバージョンファイルを作る
      # → https://abbeyroad.online/deploy.json を開けば本番の中身がすぐわかる
      # （業界では /version.json や /health などで「今動いている版」を公開するのが定番）
      # ・GITHUB_SHA        : デプロイしたコミットのID（40文字）
      # ・GITHUB_RUN_NUMBER : このワークフローが何回目の実行か
      # ・date -u +%FT%TZ   : 現在時刻を世界標準時(UTC)の ISO 8601 形式で出力
      # このファイルは Actions 上で毎回作るだけなので Git には入らない
      - name: バージョンファイル作成
        run: |
          printf '{"commit":"%s","run":%s,"deployed_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$(date -u +%FT%TZ)" > v3/deploy.json
          cat v3/deploy.json

      # 前回との差分のみアップロード（状態ファイルがサーバーに作られる）
      # config.php は本番専用なので除外。migrations/ と schema.sql は DB に手で流すもので、公開サーバーに置かない
      - name: FTP デプロイ
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./v3/
          server-dir: ${{ secrets.FTP_DIR }}
          # push のときは inputs が空なので、手動実行のときだけ入力を見る（push は常に本番）
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/*.md
            config.php
            **/config.php
            migrations/**
            schema.sql
