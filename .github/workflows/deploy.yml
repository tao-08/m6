name: Deploy

# 手動実行（Actionsタブ → Deploy → Run workflow）
# push で自動にしたい場合は下の on: に `push: { branches: [main] }` を追加
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（転送せず確認のみ）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 前回との差分のみアップロード（状態ファイルがサーバーに作られる）
      # config.php は本番専用なので除外
      - name: FTP デプロイ
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./v3/
          server-dir: ${{ secrets.FTP_DIR }}
          dry-run: ${{ inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/*.md
            config.php
            **/config.php
